# CI for qbe.mbt — a 1:1 MoonBit reimplementation of QBE.
#
# Three jobs:
#   check  — cross-platform sanity: formatting, generated interface (`.mbti`)
#            freshness, native build and unit tests (Ubuntu).
#   diff   — the core verification: byte-for-byte differential testing of every
#            debug flag against the reference C QBE built from the vendored
#            submodule (Ubuntu), plus independent assembly validation.
#
# The CI gates on every debug stage and on the emitted assembly, all of which
# are byte-identical to the frozen reference on amd64/arm64/rv64.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interface is up to date
        run: |
          moon info
          if [ -n "$(git status --porcelain -- ':(glob)**/*.mbti')" ]; then
            git diff -- ':(glob)**/*.mbti'
            echo "::error::moon info produced .mbti changes; run 'moon info' and commit them"
            exit 1
          fi

      - name: Build native
        run: moon build --target native

      - name: Unit tests (native)
        run: moon test --target native

  diff:
    name: Byte-differential vs reference QBE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Build reference QBE from the pinned snapshot
        run: make -C vendor/qbe

      # compare.py builds `_build/native/debug/build/cmd/main/main.exe`
      # internally, then diffs stdout/stderr against the reference binary
      # (auto-detected at vendor/qbe/qbe, or via $QBE_REF).
      # Every debug stage and the emitted assembly are byte-identical to the
      # frozen reference on all three backends, so all of them are gated.
      - name: "Differential: all debug flags (amd64)"
        run: python compare.py -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (arm64)"
        run: python compare.py --target arm64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (rv64)"
        run: python compare.py --target rv64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: assembly (amd64)"
        run: python compare.py --asm

      - name: "Differential: assembly (arm64)"
        run: python compare.py --target arm64 --asm

      - name: "Differential: assembly (rv64)"
        run: python compare.py --target rv64 --asm

      # Mach-O gas flavor (-G m). amd64 is byte-identical and gated; arm64
      # emission is aligned but its Apple ABI/vararg lowering (apple_selvastart
      # / apple_selvaarg / apple_extsb) is not ported yet, so it is reported
      # but not gating.
      - name: "Differential: Mach-O flavor (amd64)"
        run: python compare.py --asm -G m

      - name: "Differential: Mach-O flavor (arm64)"
        run: python compare.py --target arm64 --asm -G m
        continue-on-error: true

      - name: "ARM64 assemblability (clang)"
        run: python tools/check_arm64_asm.py

      - name: "RISC-V64 assemblability (clang)"
        run: python tools/check_rv64_asm.py
