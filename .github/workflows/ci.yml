# CI for qbe.mbt — a 1:1 MoonBit reimplementation of QBE.
#
# Three jobs:
#   check  — cross-platform sanity: formatting, generated interface (`.mbti`)
#            freshness, native build and unit tests (Ubuntu).
#   diff   — the core verification: byte-for-byte differential testing of every
#            debug flag against the reference C QBE built from the vendored
#            submodule (Ubuntu), plus independent assembly validation.
#
# The CI gates on the fully-aligned front-end flags (-dP/-dN/-dC/-dF/-dG/-dK,
# 406/406 per flag on amd64/arm64/rv64); the backend stages (isel/spill/rega)
# are still being aligned against the frozen reference.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interface is up to date
        run: |
          moon info
          if [ -n "$(git status --porcelain -- ':(glob)**/*.mbti')" ]; then
            git diff -- ':(glob)**/*.mbti'
            echo "::error::moon info produced .mbti changes; run 'moon info' and commit them"
            exit 1
          fi

      - name: Build native
        run: moon build --target native

      - name: Unit tests (native)
        run: moon test --target native

  diff:
    name: Byte-differential vs reference QBE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Build reference QBE from the pinned snapshot
        run: make -C vendor/qbe

      # compare.py builds `_build/native/debug/build/cmd/main/main.exe`
      # internally, then diffs stdout/stderr against the reference binary
      # (auto-detected at vendor/qbe/qbe, or via $QBE_REF).
      # The front-end stages are fully aligned with the frozen reference on all
      # three backends; the backend stages (isel/spill/rega) are still being
      # aligned and are reported but not yet gated.
      - name: "Differential: front-end debug flags (amd64)"
        run: python compare.py -dP -dN -dC -dF -dG -dK

      - name: "Differential: front-end debug flags (arm64)"
        run: python compare.py --target arm64 -dP -dN -dC -dF -dG -dK

      - name: "Differential: front-end debug flags (rv64)"
        run: python compare.py --target rv64 -dP -dN -dC -dF -dG -dK

      - name: "ARM64 assemblability (clang)"
        run: python tools/check_arm64_asm.py

      - name: "RISC-V64 assemblability (clang)"
        run: python tools/check_rv64_asm.py
        continue-on-error: true
