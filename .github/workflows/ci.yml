# CI for qbe.mbt, a 1:1 MoonBit reimplementation of QBE.
#
# Two jobs, both on Linux:
#   check  - formatting, generated interface (.mbti) freshness, native build
#            and unit tests.
#   diff   - the core verification: byte-for-byte differential testing of every
#            debug flag against the reference C QBE built from the vendored
#            submodule, plus an independent validity gate for all five backends
#            (clang assembler for amd64/arm64/rv64/la64, moon-wasm-opt for wasm).
#
# The macOS-only jobs (the C ABI builder and the Rust glue) are in macos.yml:
# they need an arm64 macOS runner, and keeping them separate means a runner that
# never gets scheduled cannot hide whether these gates passed.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version (require moonc >= 0.10.14)
        run: |
          set -eu
          moon version --all
          v=$(moon version --all | sed -n 's/.*moonc v\([0-9][0-9.]*\).*/\1/p' | head -n1)
          test -n "$v"
          lowest=$(printf '%s\n0.10.14\n' "$v" | sort -V | head -n1)
          if [ "$lowest" != "0.10.14" ]; then
            echo "::error::moonc $v is older than the required 0.10.14"
            exit 1
          fi
          echo "moonc $v OK"

      - name: Sync dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interface is up to date
        run: |
          moon info
          if [ -n "$(git status --porcelain -- ':(glob)**/*.mbti')" ]; then
            git diff -- ':(glob)**/*.mbti'
            echo "::error::moon info produced .mbti changes; run 'moon info' and commit them"
            exit 1
          fi

      - name: Build native
        run: moon build --target native

      - name: Unit tests (native)
        run: moon test --target native

      # The download-only installer (the file served from i2pl.com) is what
      # users pipe into sh; exercise it end to end against a staged release
      # tree over HTTP, including the piped form and the checksum path.
      - name: Installer smoke test (download-only path)
        run: |
          set -eux
          stage="$RUNNER_TEMP/releases/latest/download"
          mkdir -p "$stage"
          cp _build/native/debug/build/cmd/main/main.exe "$stage/qbe-linux-x86_64"
          (cd "$stage" && sha256sum qbe-linux-x86_64 > SHA256SUMS)
          python3 -m http.server 8765 --directory "$RUNNER_TEMP" >/dev/null 2>&1 &
          srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          sleep 1
          sh -n install.sh
          cat install.sh | sh -s -- --base-url http://127.0.0.1:8765/releases --bin-dir "$RUNNER_TEMP/bin" --no-path --yes
          "$RUNNER_TEMP/bin/qbe" --help >/dev/null

      # PowerShell is preinstalled on the runner; parse-check the Windows
      # installer so a syntax error cannot land unnoticed.
      - name: Check PowerShell installer syntax
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$t=$null; $e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/bootstrap.ps1",[ref]$t,[ref]$e); if($e){ $e | ForEach-Object { $_.Message }; exit 1 }'
          else
            echo "pwsh not available; skipping"
          fi
  diff:
    name: Byte-differential vs reference QBE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Build reference QBE from the pinned snapshot
        run: make -C vendor/qbe

      # compare.py builds `_build/native/debug/build/cmd/main/main.exe`
      # internally, then diffs stdout/stderr against the reference binary
      # (auto-detected at vendor/qbe/qbe, or via $QBE_REF).
      # Every debug stage and the emitted assembly are byte-identical to the
      # frozen reference on all three backends, so all of them are gated.
      - name: "Differential: all debug flags (amd64)"
        run: python compare.py -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (arm64)"
        run: python compare.py --target arm64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (rv64)"
        run: python compare.py --target rv64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: assembly (amd64)"
        run: python compare.py --asm

      - name: "Differential: assembly (arm64)"
        run: python compare.py --target arm64 --asm

      - name: "Differential: assembly (rv64)"
        run: python compare.py --target rv64 --asm

      # Mach-O gas flavor (-G m): both backends are byte-identical to the
      # reference's amd64_apple / arm64_apple targets.
      - name: "Differential: Mach-O flavor (amd64)"
        run: python compare.py --asm -G m

      - name: "Differential: Mach-O flavor (arm64)"
        run: python compare.py --target arm64 --asm -G m

      # Independent validity gate for every backend: amd64/arm64/rv64/la64 are
      # assembled with clang, wasm is validated with moon-wasm-opt. Inputs the
      # reference rejects are skipped, so a real backend gap fails the job.
      - name: "Cross-backend validity gate (all five targets)"
        run: python tools/check_all_backends.py

      # The two reference-less backends are also gated individually, so a
      # failure points straight at the target instead of the matrix summary.
      - name: "LoongArch64 assemblability (clang)"
        run: python tools/check_la64_asm.py

      - name: "WASM validation (moon-wasm-opt)"
        run: python tools/check_wasm.py

      # Runtime semantics for variadic functions: the interpreter and wasm32
      # run the program directly; la64 is assembled, linked and run under
      # qemu-user. All three must agree.
      - name: "Install qemu-user (la64 runtime check)"
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: "Variadic runtime semantics (interp / wasm / la64)"
        run: python tools/check_vararg_runtime.py
