# CI for qbe.mbt — a 1:1 MoonBit reimplementation of QBE.
#
# Three jobs:
#   check  — cross-platform sanity: formatting, generated interface (`.mbti`)
#            freshness, native build and unit tests (Ubuntu).
#   diff   — the core verification: byte-for-byte differential testing of every
#            debug flag and of the emitted assembly against the reference C QBE
#            built from the pinned snapshot in tools/qbe-ref (Ubuntu).
#
# Expected baselines (see test/README.md):
#   python compare.py          -> 5684/5684
#   python compare.py --asm    -> 406/406  (-G e)
#   python compare.py --asm -G m -> 406/406

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interface is up to date
        run: |
          moon info
          if [ -n "$(git status --porcelain -- ':(glob)**/*.mbti')" ]; then
            git diff -- ':(glob)**/*.mbti'
            echo "::error::moon info produced .mbti changes; run 'moon info' and commit them"
            exit 1
          fi

      - name: Build native
        run: moon build --target native

      - name: Unit tests (native)
        run: moon test --target native

  diff:
    name: Byte-differential vs reference QBE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Build reference QBE from the pinned snapshot
        run: make -C tools/qbe-ref

      # compare.py builds `_build/native/debug/build/cmd/main/main.exe`
      # internally, then diffs stdout/stderr against the reference binary
      # (auto-detected at tools/qbe-ref/obj/qbe, or via $QBE_REF).
      - name: "Differential: all debug flags"
        run: python compare.py

      - name: "Differential: assembly (-G e)"
        run: python compare.py --asm

      - name: "Differential: assembly (-G m)"
        run: python compare.py --asm -G m
