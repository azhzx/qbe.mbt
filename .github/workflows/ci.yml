# CI for qbe.mbt — a 1:1 MoonBit reimplementation of QBE.
#
# Five jobs:
#   check  — cross-platform sanity: formatting, generated interface (`.mbti`)
#            freshness, native build and unit tests (Ubuntu).
#   diff   — the core verification: byte-for-byte differential testing of every
#            debug flag against the reference C QBE built from the vendored
#            submodule (Ubuntu), plus independent assembly validation.
#   capi   — the programmatic builder's C ABI: builds the foreign library and
#            runs the C smoke test end to end (macOS arm64).
#   rust   — the Rust glue layer over that C ABI (macOS arm64).
#
# The CI gates on every debug stage and on the emitted assembly, all of which
# are byte-identical to the frozen reference on amd64/arm64/rv64.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interface is up to date
        run: |
          moon info
          if [ -n "$(git status --porcelain -- ':(glob)**/*.mbti')" ]; then
            git diff -- ':(glob)**/*.mbti'
            echo "::error::moon info produced .mbti changes; run 'moon info' and commit them"
            exit 1
          fi

      - name: Build native
        run: moon build --target native

      - name: Unit tests (native)
        run: moon test --target native

  capi:
    name: C ABI builder (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      # Builds ir_builder_capi (foreign library), then compiles the C driver
      # against include/qbe_builder.h, emits add.o + fib.o through the C ABI,
      # links them with the driver and checks the results.
      - name: Build & run C ABI smoke test
        run: bash scripts/build_capi.sh

      # demo/12_builder_capi.c builds a phi loop ($tri) and $add from C,
      # prints the generated assembly, emits Mach-O objects and runs them.
      - name: Build & run C builder demo
        run: bash scripts/run_builder_demo.sh

  rust:
    name: Rust bindings (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Toolchain versions
        run: |
          moon version --all
          rustc --version
          cargo --version

      - name: Sync dependencies
        run: moon update

      # build.rs runs `moon build --target native ir_builder_capi` and links the
      # object plus the MoonBit runtime into the crate.
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Build & test Rust bindings
        run: cargo test --manifest-path rust/Cargo.toml

  diff:
    name: Byte-differential vs reference QBE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: moon version --all

      - name: Sync dependencies
        run: moon update

      - name: Build reference QBE from the pinned snapshot
        run: make -C vendor/qbe

      # compare.py builds `_build/native/debug/build/cmd/main/main.exe`
      # internally, then diffs stdout/stderr against the reference binary
      # (auto-detected at vendor/qbe/qbe, or via $QBE_REF).
      # Every debug stage and the emitted assembly are byte-identical to the
      # frozen reference on all three backends, so all of them are gated.
      - name: "Differential: all debug flags (amd64)"
        run: python compare.py -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (arm64)"
        run: python compare.py --target arm64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: all debug flags (rv64)"
        run: python compare.py --target rv64 -dP -dM -dN -dC -dF -dA -dI -dL -dS -dR -dG -dK

      - name: "Differential: assembly (amd64)"
        run: python compare.py --asm

      - name: "Differential: assembly (arm64)"
        run: python compare.py --target arm64 --asm

      - name: "Differential: assembly (rv64)"
        run: python compare.py --target rv64 --asm

      # Mach-O gas flavor (-G m): both backends are byte-identical to the
      # reference's amd64_apple / arm64_apple targets.
      - name: "Differential: Mach-O flavor (amd64)"
        run: python compare.py --asm -G m

      - name: "Differential: Mach-O flavor (arm64)"
        run: python compare.py --target arm64 --asm -G m

      - name: "ARM64 assemblability (clang)"
        run: python tools/check_arm64_asm.py

      - name: "RISC-V64 assemblability (clang)"
        run: python tools/check_rv64_asm.py
