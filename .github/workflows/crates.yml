# Build the prebuilt native archives that the `qopple` crate ships, and publish
# the two Rust crates to crates.io on a version tag.
#
# A crates.io build runs on the consumer's machine and must not need the MoonBit
# toolchain. `rust/build.rs` therefore links a self-contained
# `libqopple_native.a` vendored per target:
#
#   rust/vendor/<target-triple>/libqopple_native.a
#
# This workflow produces those archives on the three supported platforms (the
# `vendor` job), checks that a packaged crate really links them (the `verify`
# job) and, for a `v*` tag, publishes both crates (the `publish` job). The
# archives are gitignored; they only travel inside the published .crate.

name: crates.io

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    name: vendor ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain versions
        run: |
          moon version --all
          cargo --version

      - name: Sync dependencies
        run: moon update

      - name: Build the MoonBit runtime
        run: moon build --target native

      - name: Native build layout (diagnostic)
        if: always()
        run: |
          set -x
          find _build -name '*ir_builder_capi*' -print 2>/dev/null | head -60
          find _build -name 'libruntime*.a' -print 2>/dev/null | head
          find _build -name 'native_stub.o' -print 2>/dev/null | head

      # Force the from-source path so the archive cannot be a stale vendored one.
      - name: Build the qopple native archive
        env:
          QOPPLE_BUILD_FROM_SOURCE: "1"
        run: cargo build --manifest-path rust/Cargo.toml --release

      - name: Stage the vendored archive
        run: |
          set -eux
          src=$(find rust/target/release/build -name 'libqopple_native.a' | head -n 1)
          test -n "$src"
          mkdir -p "rust/vendor/${{ matrix.triple }}"
          cp "$src" "rust/vendor/${{ matrix.triple }}/libqopple_native.a"
          ls -la "rust/vendor/${{ matrix.triple }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.triple }}
          path: rust/vendor/${{ matrix.triple }}/libqopple_native.a
          if-no-files-found: error

  verify:
    name: Verify packaged crates (${{ matrix.os }})
    needs: vendor
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download vendored archives
        uses: actions/download-artifact@v4
        with:
          name: vendor-aarch64-apple-darwin
          path: rust/vendor/aarch64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: vendor-x86_64-unknown-linux-gnu
          path: rust/vendor/x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          name: vendor-aarch64-unknown-linux-gnu
          path: rust/vendor/aarch64-unknown-linux-gnu

      - name: Show staged archives
        run: find rust/vendor -type f

      # The vendored archives are generated inputs, not tracked files, so cargo
      # sees them as uncommitted; --allow-dirty is expected here.
      - name: Package both crates
        run: |
          set -eux
          cargo package --manifest-path rust/Cargo.toml --allow-dirty
          cargo package --manifest-path rust/qopple-cli/Cargo.toml

      # Linking the packaged examples forces the vendored archive through the
      # linker, which a plain `cargo package` verification (rlib only) does not.
      - name: Link the packaged native archive
        run: |
          set -eux
          pkg=$(ls -d rust/target/package/qopple-*/ | head -n 1)
          cargo build --examples --manifest-path "${pkg}Cargo.toml"

      - name: Size gate (crates.io limit is 10 MiB compressed)
        run: |
          set -eux
          for f in rust/target/package/*.crate; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            test "$size" -lt $((10 * 1024 * 1024))
          done

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: vendor-aarch64-apple-darwin
          path: rust/vendor/aarch64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: vendor-x86_64-unknown-linux-gnu
          path: rust/vendor/x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          name: vendor-aarch64-unknown-linux-gnu
          path: rust/vendor/aarch64-unknown-linux-gnu

      - name: Publish qopple
        run: cargo publish --manifest-path rust/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish qopple-cli
        run: cargo publish --manifest-path rust/qopple-cli/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
